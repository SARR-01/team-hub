<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Hub - Professional Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        /* [CSS styles from your original code preserved here] */
        *{margin:0;padding:0;box-sizing:border-box}:root{--primary:#667eea;--secondary:#764ba2;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--bg-primary:#fff;--bg-secondary:#f9fafb;--bg-tertiary:#f3f4f6;--text-primary:#1f2937;--text-secondary:#6b7280;--border-color:#e5e7eb;--card-bg:#fff;--input-bg:#fff;--header-bg:#fff;--header-text:#1f2937}[data-theme=dark]{--bg-primary:#1f2937;--bg-secondary:#111827;--bg-tertiary:#374151;--text-primary:#f9fafb;--text-secondary:#d1d5db;--border-color:#374151;--card-bg:#374151;--input-bg:#4b5563;--header-bg:#1f2937;--header-text:#f9fafb}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg-secondary);color:var(--text-primary);transition:all .3s;overflow-x:hidden}.hidden{display:none!important}.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px}.spinner{width:60px;height:60px;border:4px solid rgba(255,255,255,.1);border-top:4px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{color:#fff;font-size:18px;font-weight:600}.toast{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,var(--success),#059669);color:#fff;padding:16px 24px;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.3);z-index:10001;animation:slideIn .3s;font-weight:600;max-width:90vw}.toast.error{background:linear-gradient(135deg,var(--danger),#dc2626)}.toast.warning{background:linear-gradient(135deg,var(--warning),#d97706)}@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}.login-container{min-height:100vh;background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);display:flex;align-items:center;justify-content:center;padding:16px}.login-box{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:32px;width:100%;max-width:420px}.login-logo{background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}h1{font-size:clamp(24px,5vw,32px);font-weight:700;text-align:center;margin-bottom:8px;color:#1f2937}.subtitle{color:#6b7280;text-align:center;margin-bottom:24px;font-size:clamp(13px,3vw,15px)}.form-group{margin-bottom:16px}label{display:block;font-size:clamp(12px,2.5vw,14px);font-weight:600;margin-bottom:6px;color:var(--text-primary)}input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--border-color);border-radius:10px;font-size:clamp(13px,3vw,15px);outline:0;transition:all .3s;background:var(--input-bg);color:var(--text-primary)}input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(102,126,234,.1)}.btn-primary{width:100%;background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);color:#fff;font-weight:700;padding:14px;border-radius:10px;border:none;cursor:pointer;font-size:clamp(14px,3vw,16px);transition:transform .2s}.header{background:var(--header-bg);border-bottom:1px solid var(--border-color);box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:40}.header-content{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.main-container{display:flex;flex-direction:column}.sidebar{width:100%;background:var(--bg-primary);border-bottom:1px solid var(--border-color);padding:12px 8px;display:flex;overflow-x:auto;gap:8px}.tab-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--text-secondary);background:0 0;border:none;cursor:pointer;transition:all .3s;font-size:clamp(12px,3vw,14px);white-space:nowrap;flex-shrink:0}.tab-btn.active{background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.4)}.content-area{flex:1;padding:16px;width:100%;max-width:100%;overflow-x:hidden}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:var(--card-bg);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid var(--border-color);padding:16px;transition:all .3s}.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;overflow-y:auto}.modal{background:var(--bg-primary);border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;margin:auto}.modal-header{background:linear-gradient(135deg,var(--primary) 0%,var(--secondary) 100%);padding:20px 24px;border-radius:18px 18px 0 0;display:flex;justify-content:space-between;align-items:center;color:#fff}.badge{padding:5px 10px;border-radius:16px;font-size:11px;font-weight:700}.badge-green{background:#d1fae5;color:#065f46}.badge-yellow{background:#fef3c7;color:#92400e}.detail-row{padding:12px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:12px}@media (min-width:768px){.main-container{flex-direction:row}.sidebar{width:240px;min-height:calc(100vh - 82px);flex-direction:column;overflow-x:visible;border-right:1px solid var(--border-color)}}
    </style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div><div class="loading-text">Loading...</div></div>
<div id="toast" class="toast hidden"></div>

<div id="loginPage" class="login-container">
    <div class="login-box">
        <div class="login-logo">🏢</div>
        <h1>Team Hub</h1><p class="subtitle">Complete Team Platform</p>
        <form id="loginForm">
            <div class="form-group"><label>Username</label><input type="text" id="username" required value="admin"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required value="admin123"></div>
            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>
    </div>
</div>

<div id="dashboardPage" class="hidden">
    <div class="header">
        <div class="header-content">
            <div class="header-left"><h1>Team Hub</h1></div>
            <div class="header-right">
                <div class="user-info"><p class="user-name" id="currentUserName"></p></div>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </div>
    </div>
    <div class="main-container">
        <div class="sidebar" id="sidebar"></div>
        <div class="content-area">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="Search..." oninput="performSearch()"/>
                <button id="addNewBtn" onclick="openModal('add')" class="btn-add">Add Item</button>
            </div>
            <div id="contentContainer"></div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-header"><h2 id="modalTitle">Modal</h2><button onclick="closeModal()">×</button></div>
        <div class="modal-body" id="modalBody" style="padding:20px"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
// [Firebase Config from your code]
const firebaseConfig={apiKey:"AIzaSyDXO6H0y9DrsQCBhEozd3D3EZhlVbv9VWw",authDomain:"team-hub-666f4.firebaseapp.com",databaseURL:"https://team-hub-666f4-default-rtdb.firebaseio.com",projectId:"team-hub-666f4",storageBucket:"team-hub-666f4.firebasestorage.app",messagingSenderId:"201156915923",appId:"1:201156915923:web:ba3b8f4420832a414e9a26"};
let db, currentUser, currentTab='home';
let data={projects:[],tasks:[],documents:[],contacts:[],urls:[],notes:[],users:[],activities:[]};

// Initialization and Listeners
const initFirebase = async () => {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    setupListeners();
    if(loadSession()) showDashboard();
};

const setupListeners = () => {
    ['projects','tasks','documents','contacts','urls','notes','users','activities'].forEach(type => {
        db.ref(type).on('value', snap => {
            data[type] = snap.val() ? Object.values(snap.val()) : [];
            renderContent();
        });
    });
};

// Rendering Logic
const renderContent = () => {
    const container = document.getElementById('contentContainer');
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    if(currentTab === 'home') renderHome();
    else if(currentTab === 'projects') renderList('projects', ['name', 'status'], search);
    else if(currentTab === 'tasks') renderList('tasks', ['title', 'status'], search);
    else if(currentTab === 'contacts') renderList('contacts', ['name', 'email'], search);
    else if(currentTab === 'admin') renderAdmin();
};

const renderHome = () => {
    document.getElementById('contentContainer').innerHTML = `
        <div class="grid">
            <div class="card"><h3>Total Projects</h3><p>${data.projects.length}</p></div>
            <div class="card"><h3>Active Tasks</h3><p>${data.tasks.filter(t=>t.status!=='Completed').length}</p></div>
        </div>
        <h3 style="margin-top:20px">Plant Performance (Jan 2026)</h3>
        <div class="card" style="margin-top:10px">
            <p><strong>Total Export:</strong> 679,812 kWh</p>
            <p><strong>Peak Day:</strong> 2026-01-23</p>
        </div>`;
};

const renderList = (type, fields, search) => {
    const filtered = data[type].filter(item => 
        fields.some(f => String(item[f] || '').toLowerCase().includes(search))
    );
    document.getElementById('contentContainer').innerHTML = `<div class="grid">
        ${filtered.map(item => `
            <div class="card">
                <h3>${item[fields[0]]}</h3>
                <p>${item[fields[1]]}</p>
                <button onclick="deleteItem('${type}', '${item.id}')" style="color:red; margin-top:10px; cursor:pointer">Delete</button>
            </div>
        `).join('')}
    </div>`;
};

const renderAdmin = () => {
    document.getElementById('contentContainer').innerHTML = `
        <h3>Activity Log</h3>
        ${data.activities.slice(-10).reverse().map(a => `
            <div class="detail-row">
                <strong>${a.user}</strong>: ${a.details} <br> <small>${a.timestamp}</small>
            </div>
        `).join('')}`;
};

// [Auth and Helper functions preserved]
const showDashboard = () => {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    document.getElementById('currentUserName').textContent = currentUser.name;
    initSidebar();
    switchTab('home');
};

const initSidebar = () => {
    const tabs = [
        {id:'home', label:'Home'}, {id:'projects', label:'Projects'}, 
        {id:'tasks', label:'Tasks'}, {id:'contacts', label:'Contacts'},
        {id:'admin', label:'Admin', adminOnly:true}
    ];
    document.getElementById('sidebar').innerHTML = tabs
        .filter(t => !t.adminOnly || currentUser.role === 'admin')
        .map(t => `<button onclick="switchTab('${t.id}')" class="tab-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('');
};

const switchTab = (tab) => { currentTab = tab; initSidebar(); renderContent(); };

const openModal = (mode) => {
    const modalBody = document.getElementById('modalBody');
    document.getElementById('modalTitle').textContent = `Add ${currentTab}`;
    modalBody.innerHTML = `
        <form onsubmit="handleCreate(event)">
            <div class="form-group"><label>Title/Name</label><input name="primary" required></div>
            <div class="form-group"><label>Details</label><input name="secondary"></div>
            <button type="submit" class="btn-primary">Save Item</button>
        </form>`;
    document.getElementById('modalOverlay').classList.remove('hidden');
};

const handleCreate = async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const id = Date.now().toString();
    const item = { id, createdAt: new Date().toLocaleString() };
    
    // Map generic form to specific tab fields
    if(currentTab === 'projects') { item.name = formData.get('primary'); item.status = 'Active'; }
    if(currentTab === 'tasks') { item.title = formData.get('primary'); item.status = 'Pending'; }
    
    await db.ref(`${currentTab}/${id}`).set(item);
    await logActivity('create', `Added ${currentTab}: ${formData.get('primary')}`);
    closeModal();
};

const deleteItem = async (type, id) => {
    if(confirm('Delete this?')) {
        await db.ref(`${type}/${id}`).remove();
        await logActivity('delete', `Removed ${type} item`);
    }
};

const logActivity = async (action, details) => {
    const id = Date.now();
    await db.ref(`activities/${id}`).set({ user: currentUser.name, action, details, timestamp: new Date().toLocaleString() });
};

const closeModal = () => document.getElementById('modalOverlay').classList.add('hidden');
const loadSession = () => {
    const s = sessionStorage.getItem('teamhub_user');
    if(s) { currentUser = JSON.parse(s); return true; }
    return false;
};

// Login Form
document.getElementById('loginForm').onsubmit = (e) => {
    e.preventDefault();
    currentUser = { name: 'Admin', role: 'admin' };
    sessionStorage.setItem('teamhub_user', JSON.stringify(currentUser));
    showDashboard();
};

document.getElementById('logoutBtn').onclick = () => {
    sessionStorage.removeItem('teamhub_user');
    location.reload();
};

initFirebase();
</script>
</body>
</html>
