                <div class="search-wrapper"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><input type="text" id="searchInput" class="search-input" placeholder="Search by name or #tags..." oninput="performSearch()"/></div>
                <button id="addNewBtn" onclick="openModal('add')" class="btn-add"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg><span id="addBtnText">Add Item</span></button>

<script>
const firebaseConfig={apiKey:"AIzaSyDXO6H0y9DrsQCBhEozd3D3EZhlVbv9VWw",authDomain:"team-hub-666f4.firebaseapp.com",databaseURL:"https://team-hub-666f4-default-rtdb.firebaseio.com",projectId:"team-hub-666f4",storageBucket:"team-hub-666f4.firebasestorage.app",messagingSenderId:"201156915923",appId:"1:201156915923:web:ba3b8f4420832a414e9a26"};
let db,currentUser,currentTab='home';
let data={projects:[],tasks:[],documents:[],contacts:[],urls:[],notes:[],users:[],activities:[]};
let listeners={};

const showLoading=(show=true,text='Loading...')=>{const overlay=document.getElementById('loadingOverlay');overlay.querySelector('.loading-text').textContent=text;overlay.classList.toggle('hidden',!show)};
const showToast=(message,type='success')=>{const toast=document.getElementById('toast');toast.textContent=message;toast.classList.remove('error','warning');if(type==='error')toast.classList.add('error');if(type==='warning')toast.classList.add('warning');toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),5000)};
const getDateTime=()=>new Date().toLocaleString('en-US',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:true});
const saveSession=()=>currentUser&&sessionStorage.setItem('teamhub_user',JSON.stringify(currentUser));

const toggleThemePicker=()=>{document.getElementById('themePicker').classList.toggle('hidden')};
const toggleDarkMode=()=>{const theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('darkMode',theme);document.getElementById('themeIcon').innerHTML=theme==='dark'?'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>':'<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';showToast(`${theme==='dark'?'🌙':'☀️'} ${theme} mode`)};

const applyPresetTheme=(theme)=>{const themes={default:{primary:'#667eea',secondary:'#764ba2'},ocean:{primary:'#2E3192',secondary:'#1BFFFF'},sunset:{primary:'#FF512F',secondary:'#F09819'},forest:{primary:'#134E5E',secondary:'#71B280'},rose:{primary:'#ec4899',secondary:'#f43f5e'},night:{primary:'#2c3e50',secondary:'#3498db'}};if(themes[theme]){document.documentElement.style.setProperty('--primary',themes[theme].primary);document.documentElement.style.setProperty('--secondary',themes[theme].secondary);localStorage.setItem('customTheme',JSON.stringify(themes[theme]));showToast(`🎨 ${theme.charAt(0).toUpperCase()+theme.slice(1)} theme applied`)}};

const applyCustomTheme=()=>{const primary=document.getElementById('customPrimary').value;const secondary=document.getElementById('customSecondary').value;document.documentElement.style.setProperty('--primary',primary);document.documentElement.style.setProperty('--secondary',secondary);localStorage.setItem('customTheme',JSON.stringify({primary,secondary}));showToast('🎨 Custom theme applied')};

const generateTags=(text)=>{const stopWords=['the','a','an','and','or','but','in','on','at','to','for','of','with','is','it'];const words=text.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>2&&!stopWords.includes(w));return[...new Set(words)].slice(0,5).map(w=>'#'+w)};

const searchByTag=(tag)=>{document.getElementById('searchInput').value=tag;performSearch()};

const initFirebase=async()=>{showLoading(true,'Initializing...');try{firebase.initializeApp(firebaseConfig);db=firebase.database();const usersSnap=await db.ref('users').once('value');if(!usersSnap.exists()){await db.ref('users').set({'admin':{username:'admin',password:'admin123',email:'admin@team.com',role:'admin',createdAt:getDateTime()},'user1':{username:'user1',password:'user123',email:'user@team.com',role:'user',createdAt:getDateTime()}})}setupListeners();const savedDarkMode=localStorage.getItem('darkMode');if(savedDarkMode){document.documentElement.setAttribute('data-theme',savedDarkMode)}const savedTheme=localStorage.getItem('customTheme');if(savedTheme){const theme=JSON.parse(savedTheme);document.documentElement.style.setProperty('--primary',theme.primary);document.documentElement.style.setProperty('--secondary',theme.secondary)}if(loadSession()){showDashboard();showToast('✅ Welcome back!')}else{document.getElementById('loginPage').classList.remove('hidden')}showLoading(false)}catch(error){showLoading(false);showToast('❌ Error: '+error.message,'error');document.getElementById('loginPage').classList.remove('hidden')}};

const setupListeners=()=>{['projects','tasks','documents','contacts','urls','notes','users','activities'].forEach(type=>{listeners[type]=db.ref(type).on('value',snap=>{data[type]=snap.val()?Object.values(snap.val()):[];if(currentUser&&currentTab===type)renderContent();if(type==='users'&&currentUser&&currentUser.role==='admin'&&currentTab==='admin')renderContent();if(currentTab==='home')renderHome()})})};

const removeListeners=()=>{Object.keys(listeners).forEach(key=>{if(listeners[key])db.ref(key).off('value',listeners[key])});listeners={}};

document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value.trim();const btn=document.getElementById('loginBtn');if(!username||!password){showToast('❌ Please enter credentials','error');return}btn.disabled=true;btn.textContent='Signing in...';try{const snap=await db.ref('users').once('value');const users=snap.val()?Object.values(snap.val()):[];const user=users.find(u=>u.username===username&&u.password===password);if(user){currentUser={name:user.username,role:user.role,email:user.email};await db.ref(`users/${username}/lastLogin`).set(getDateTime());await logActivity('login',`${username} logged in`);saveSession();showDashboard();showToast(`✅ Welcome ${user.username}!`)}else{showToast('❌ Invalid credentials','error')}}catch(error){showToast('❌ Login failed','error')}finally{btn.disabled=false;btn.textContent='Sign In'}});

const showDashboard=()=>{document.getElementById('loginPage').classList.add('hidden');document.getElementById('dashboardPage').classList.remove('hidden');document.getElementById('currentUserName').textContent=currentUser.name;document.getElementById('currentUserRole').textContent=currentUser.role;initSidebar();switchTab('home')};

document.getElementById('logoutBtn').addEventListener('click',async()=>{if(confirm('Logout?')){await logActivity('logout',`${currentUser.name} logged out`);removeListeners();clearSession();showToast('✅ Logged out');setTimeout(()=>{document.getElementById('loginPage').classList.remove('hidden');document.getElementById('dashboardPage').classList.add('hidden');document.getElementById('username').value='';document.getElementById('password').value='';currentTab='home'},1000)}});

const initSidebar=()=>{const tabs=[{id:'home',icon:'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6',label:'Home'},{id:'projects',icon:'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z',label:'Projects'},{id:'tasks',icon:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4',label:'Tasks'},{id:'documents',icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',label:'Documents'},{id:'contacts',icon:'M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z',label:'Contacts'},{id:'urls',icon:'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1',label:'URLs'},{id:'notes',icon:'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z',label:'Notes'},{id:'admin',icon:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z',label:'Admin',adminOnly:true}];const sidebar=document.getElementById('sidebar');sidebar.innerHTML=tabs.filter(t=>!t.adminOnly||currentUser.role==='admin').map(t=>`<button onclick="switchTab('${t.id}')" class="tab-btn ${t.id==='home'?'active':''}" data-tab="${t.id}"><svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg>${t.label}</button>`).join('')};

const switchTab=(tab)=>{currentTab=tab;document.getElementById('searchInput').value='';document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');const hideAdd=['home','contacts'];document.getElementById('addNewBtn').classList.toggle('hidden',hideAdd.includes(tab));const labels={projects:'Project',tasks:'Task',documents:'Document',urls:'URL',notes:'Note',admin:'User'};document.getElementById('addBtnText').textContent='Add '+(labels[tab]||'Item');renderContent()};

const performSearch=()=>renderContent();
const renderContent=()=>{if(currentTab==='home')renderHome();else if(currentTab==='projects')renderProjects();else if(currentTab==='tasks')renderTasks();else if(currentTab==='documents')renderDocuments();else if(currentTab==='contacts')renderContacts();else if(currentTab==='urls')renderUrls();else if(currentTab==='notes')renderNotes();else if(currentTab==='admin')renderAdmin()};

const renderHome=()=>{const container=document.getElementById('contentContainer');const search=document.getElementById('searchInput').value.toLowerCase();if(search){const results={projects:data.projects.filter(p=>p.name.toLowerCase().includes(search)||p.description?.toLowerCase().includes(search)||(p.tags&&p.tags.some(t=>t.includes(search)))),tasks:data.tasks.filter(t=>t.title?.toLowerCase().includes(search)||t.description?.toLowerCase().includes(search)||(t.tags&&t.tags.some(t=>t.includes(search)))),documents:data.documents.filter(d=>d.name?.toLowerCase().includes(search)),contacts:data.contacts.filter(c=>c.name?.toLowerCase().includes(search)||c.email?.toLowerCase().includes(search)),urls:data.urls.filter(u=>u.title?.toLowerCase().includes(search)),notes:data.notes.filter(n=>n.title?.toLowerCase().includes(search)||n.content?.toLowerCase().includes(search))};let html=`<h2 style="margin-bottom:16px;">🔍 Search Results for "${search}"</h2>`;const sections=[{key:'projects',label:'📁 Projects',tab:'projects'},{key:'tasks',label:'✅ Tasks',tab:'tasks'},{key:'documents',label:'📄 Documents',tab:'documents'},{key:'contacts',label:'👥 Contacts',tab:'contacts'},{key:'urls',label:'🔗 URLs',tab:'urls'},{key:'notes',label:'📝 Notes',tab:'notes'}];sections.forEach(section=>{if(results[section.key].length>0){html+=`<h3 style="margin:20px 0 12px;">${section.label} (${results[section.key].length})</h3><div class="grid">`;results[section.key].forEach(item=>{const title=item.name||item.title||'Untitled';html+=`<div class="card" onclick="switchTab('${section.tab}')"><div class="card-title">${title}</div></div>`});html+='</div>'}});if(!html.includes('grid')){html+='<p style="text-align:center;padding:40px;color:var(--text-secondary);">No results found</p>'}container.innerHTML=html;return}const activeProjects=data.projects.filter(p=>p.status==='Active').length;const completedProjects=data.projects.filter(p=>p.status==='Completed').length;const pendingTasks=data.tasks.filter(t=>t.status!=='Completed').length;const recentProjects=data.projects.slice(-5).reverse();const recentTasks=data.tasks.slice(-5).reverse();const recentDocs=data.documents.slice(-5).reverse();const recentNotes=data.notes.slice(-5).reverse();container.innerHTML=`<div class="stats-grid"><div class="stat-card blue" onclick="switchTab('projects')" title="Click to view all projects"><div class="stat-number blue">${data.projects.length}</div><div class="stat-label">Total Projects</div></div><div class="stat-card green" onclick="switchTab('tasks')" title="Click to view all tasks"><div class="stat-number green">${pendingTasks}</div><div class="stat-label">Pending Tasks</div></div><div class="stat-card purple" onclick="switchTab('documents')" title="Click to view all documents"><div class="stat-number purple">${data.documents.length}</div><div class="stat-label">Documents</div></div><div class="stat-card orange" onclick="switchTab('contacts')" title="Click to view all contacts"><div class="stat-number orange">${data.contacts.length}</div><div class="stat-label">Contacts</div></div></div><h2 style="margin:24px 0 16px;font-size:20px;">Welcome, ${currentUser.name}! 👋</h2><div class="detail-row"><div class="detail-label">Quick Stats</div><div class="detail-value">Active: ${activeProjects} | Completed: ${completedProjects} | Pending Tasks: ${pendingTasks}</div></div><h3 style="margin:24px 0 16px;font-size:18px;">📁 Recent Projects</h3><div class="grid">${recentProjects.length?recentProjects.map(p=>`<div class="card" onclick="switchTab('projects')"><div class="card-title">${p.name}</div>${p.tags&&p.tags.length?`<div class="tag-container">${p.tags.map(tag=>`<span class="tag" onclick="event.stopPropagation();searchByTag('${tag}')">${tag}</span>`).join('')}</div>`:''}<p class="card-meta">${p.status} • ${p.createdAt}</p></div>`).join(''):'<p style="color:var(--text-secondary);">No projects yet</p>'}</div><h3 style="margin:24px 0 16px;font-size:18px;">✅ Recent Tasks</h3><div class="grid">${recentTasks.length?recentTasks.map(t=>`<div class="card" onclick="switchTab('tasks')"><div class="card-title">${t.title}</div>${t.tags&&t.tags.length?`<div class="tag-container">${t.tags.map(tag=>`<span class="tag" onclick="event.stopPropagation();searchByTag('${tag}')">${tag}</span>`).join('')}</div>`:''}<p class="card-meta">${t.priority} • ${t.status}</p></div>`).join(''):'<p style="color:var(--text-secondary);">No tasks yet</p>'}</div><h3 style="margin:24px 0 16px;font-size:18px;">📄 Recent Documents</h3><div class="grid">${recentDocs.length?recentDocs.map(d=>`<div class="card" onclick="switchTab('documents')"><div class="card-title">${d.name}</div><p class="card-meta">📄 ${d.files?.length||0} files • ${d.uploadedAt}</p></div>`).join(''):'<p style="color:var(--text-secondary);">No documents yet</p>'}</div><h3 style="margin:24px 0 16px;font-size:18px;">📝 Recent Notes</h3><div class="grid">${recentNotes.length?recentNotes.map(n=>`<div class="card" onclick="switchTab('notes')"><div class="card-title">${n.title}</div><p class="card-meta">${n.category||'General'} • ${n.createdAt}</p></div>`).join(''):'<p style="color:var(--text-secondary);">No notes yet</p>'}</div>`};

const renderProjects=()=>{const search=document.getElementById('searchInput').value.toLowerCase();const filtered=data.projects.filter(p=>p.name.toLowerCase().includes(search)||p.description?.toLowerCase().includes(search)||(p.tags&&p.tags.some(t=>t.includes(search))));document.getElementById('contentContainer').innerHTML=`<div class="grid">${filtered.length?filtered.map(p=>`<div class="card" style="cursor:default;"><div class="card-header"><div class="card-title">${p.name}</div><div class="card-actions"><button class="btn-icon view" onclick='viewProject(${JSON.stringify(p).replace(/'/g,"&apos;")})' title="View">👁️</button>${canEdit(p)?`<button class="btn-icon edit" onclick='editProject(${JSON.stringify(p).replace(/'/g,"&apos;")})' title="Edit">✏️</button><button class="btn-icon delete" onclick="deleteItem('project','${p.id}')" title="Delete">🗑️</button>`:''}</div></div><p class="card-description">${(p.description||'').substring(0,100)}...</p>${p.tags&&p.tags.length?`<div class="tag-container">${p.tags.map(tag=>`<span class="tag" onclick="searchByTag('${tag}')">${tag}</span>`).join('')}</div>`:''}<div class="card-footer"><span class="badge badge-${p.status==='Active'?'green':p.status==='Completed'?'purple':'blue'}">${p.status}</span><span class="card-meta">${p.createdBy} • ${p.createdAt}</span></div></div>`).join(''):'<p style="text-align:center;padding:40px;color:var(--text-secondary);">No projects found</p>'}</div>`};

const viewProject=(project)=>{const modal=document.getElementById('modalBody');modal.innerHTML=`<div class="detail-row"><div class="detail-label">Project Name</div><div class="detail-value">${project.name}</div></div><div class="detail-row"><div class="detail-label">Description</div><div class="detail-value">${project.description}</div></div><div class="detail-row"><div class="detail-label">Status</div><div class="detail-value"><span class="badge badge-${project.status==='Active'?'green':project.status==='Completed'?'purple':'blue'}">${project.status}</span></div></div>${project.tags&&project.tags.length?`<div class="detail-row"><div class="detail-label">Tags</div><div class="tag-container">${project.tags.map(tag=>`<span class="tag" onclick="searchByTag('${tag}');closeModal()">${tag}</span>`).join('')}</div></div>`:''}<div class="detail-row"><div class="detail-label">Created By</div><div class="detail-value">${project.createdBy}</div></div><div class="detail-row"><div class="detail-label">Created At</div><div class="detail-value">${project.createdAt}</div></div>${canEdit(project)?`<div class="modal-buttons"><button class="btn-submit" onclick='editProject(${JSON.stringify(project).replace(/'/g,"&apos;")})'>✏️ Edit</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`:'<button class="btn-cancel" onclick="closeModal()" style="width:100%;">Close</button>'}`;document.getElementById('modalTitle').textContent='📁 Project Details';document.getElementById('modalOverlay').classList.remove('hidden')};

const editProject=(project)=>{closeModal();setTimeout(()=>{const modal=document.getElementById('modalBody');modal.innerHTML=`<form id="editProjectForm" onsubmit="saveProject(event,'${project.id}')"><div class="form-group"><label>Project Name *</label><input type="text" name="name" value="${project.name}" required/></div><div class="form-group"><label>Description *</label><textarea name="description" required>${project.description}</textarea></div><div class="form-group"><label>Status *</label><select name="status"><option ${project.status==='Active'?'selected':''}>Active</option><option ${project.status==='In Progress'?'selected':''}>In Progress</option><option ${project.status==='Completed'?'selected':''}>Completed</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">💾 Save</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`;document.getElementById('modalTitle').textContent='✏️ Edit Project';document.getElementById('modalOverlay').classList.remove('hidden')},100)};

const saveProject=async(e,id)=>{e.preventDefault();const formData=new FormData(e.target);const projectData=Object.fromEntries(formData);projectData.tags=generateTags(projectData.name);showLoading(true,'Saving...');try{const project=data.projects.find(p=>p.id===id);await db.ref(`projects/${id}`).set({...project,...projectData});await logActivity('update',`${currentUser.name} updated project: ${projectData.name}`);showToast('✅ Project updated');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const renderTasks=()=>{const search=document.getElementById('searchInput').value.toLowerCase();const filtered=data.tasks.filter(t=>t.title?.toLowerCase().includes(search)||t.description?.toLowerCase().includes(search)||(t.tags&&t.tags.some(tag=>tag.includes(search))));document.getElementById('contentContainer').innerHTML=`<div class="grid">${filtered.length>0?filtered.map(t=>`<div class="card" style="cursor:default;"><div class="card-header"><div class="card-title">${t.title}</div><div class="card-actions"><button class="btn-icon view" onclick='viewTask(${JSON.stringify(t).replace(/'/g,"&apos;")})' title="View">👁️</button>${canEdit(t)?`<button class="btn-icon edit" onclick='editTask(${JSON.stringify(t).replace(/'/g,"&apos;")})' title="Edit">✏️</button><button class="btn-icon delete" onclick="deleteItem('task','${t.id}')" title="Delete">🗑️</button>`:''}</div></div><p class="card-description">${(t.description||'').substring(0,100)}...</p>${t.tags&&t.tags.length?`<div class="tag-container">${t.tags.map(tag=>`<span class="tag" onclick="searchByTag('${tag}')">${tag}</span>`).join('')}</div>`:''}<div class="card-footer"><span class="badge badge-${t.priority==='Urgent'?'red':t.priority==='High'?'orange':t.priority==='Medium'?'yellow':'green'}">${t.priority}</span><span class="badge badge-${t.status==='Completed'?'purple':t.status==='In Progress'?'blue':'green'}">${t.status}</span><span class="card-meta">${t.createdBy} • ${t.dueDate||'No date'}</span></div></div>`).join(''):'<p style="text-align:center;padding:40px;color:var(--text-secondary);">No tasks found</p>'}</div>`};

const viewUrl=(url)=>{const modal=document.getElementById('modalBody');const linksList=(url.links||[]).map(link=>`<div style="padding:10px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:8px;"><a href="${link}" target="_blank" rel="noopener noreferrer" style="color:var(--primary);text-decoration:none;word-break:break-all;">${link}</a></div>`).join('');modal.innerHTML=`<div class="detail-row"><div class="detail-label">Title</div><div class="detail-value">${url.title}</div></div><div class="detail-row"><div class="detail-label">Added By</div><div class="detail-value">${url.addedBy}</div></div><div style="margin-top:16px;"><div class="detail-label">Links</div>${linksList}</div>${canEdit(url)?`<div class="modal-buttons"><button class="btn-submit" onclick='editUrl(${JSON.stringify(url).replace(/'/g,"&apos;")})'>✏️ Edit</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`:'<button class="btn-cancel" onclick="closeModal()" style="width:100%;">Close</button>'}`;document.getElementById('modalTitle').textContent='🔗 URL Details';document.getElementById('modalOverlay').classList.remove('hidden')};

const editUser=(user)=>{const modal=document.getElementById('modalBody');modal.innerHTML=`<form id="editUserForm" onsubmit="saveUser(event,'${user.username}')"><div class="form-group"><label>Username</label><input type="text" value="${user.username}" readonly style="background:var(--bg-tertiary);"/></div><div class="form-group"><label>Email *</label><input type="email" name="email" value="${user.email}" required/></div><div class="form-group"><label>Password</label><input type="password" name="password" placeholder="Leave blank to keep current" minlength="6"/></div><div class="form-group"><label>Role *</label><select name="role"><option value="user" ${user.role==='user'?'selected':''}>User</option><option value="admin" ${user.role==='admin'?'selected':''}>Admin</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">💾 Save</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`;document.getElementById('modalTitle').textContent='✏️ Edit User';document.getElementById('modalOverlay').classList.remove('hidden')};

const saveUser=async(e,username)=>{e.preventDefault();const formData=new FormData(e.target);const userData=Object.fromEntries(formData);showLoading(true,'Saving...');try{const user=data.users.find(u=>u.username===username);const updatedUser={...user,email:userData.email,role:userData.role,password:userData.password||user.password};await db.ref(`users/${username}`).set(updatedUser);await logActivity('update',`${currentUser.name} updated user: ${username}`);showToast('✅ User updated');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const openModal=(mode)=>{const modal=document.getElementById('modalBody');const title=document.getElementById('modalTitle');if(currentTab==='projects'){title.textContent='➕ Add Project';modal.innerHTML=`<form id="addForm" onsubmit="addProject(event)"><div class="form-group"><label>Project Name *</label><input type="text" name="name" required/></div><div class="form-group"><label>Description *</label><textarea name="description" required></textarea></div><div class="form-group"><label>Status *</label><select name="status"><option>Active</option><option>In Progress</option><option>Completed</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='tasks'){title.textContent='➕ Add Task';modal.innerHTML=`<form id="addForm" onsubmit="addTask(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required/></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Priority *</label><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div><div class="form-group"><label>Status *</label><select name="status"><option>To Do</option><option selected>In Progress</option><option>Completed</option></select></div><div class="form-group"><label>Due Date</label><input type="date" name="dueDate"/></div><div class="form-group"><label>Assigned To</label><select name="assignedTo"><option value="">Unassigned</option>${data.users.map(u=>`<option value="${u.username}">${u.username}</option>`).join('')}</select></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='documents'){title.textContent='➕ Upload Document';modal.innerHTML=`<form id="addForm" onsubmit="addDocument(event)"><div class="form-group"><label>Document Name *</label><input type="text" name="name" required/></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Upload Files *</label><input type="file" id="fileInput" multiple required/></div><div class="modal-buttons"><button type="submit" class="btn-submit" id="uploadBtn">Upload</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='urls'){title.textContent='➕ Add URLs';modal.innerHTML=`<form id="addForm" onsubmit="addUrl(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required/></div><div class="form-group"><label>URLs</label><div id="urlsContainer"><div style="margin-bottom:8px;"><input type="url" placeholder="https://example.com" required/></div></div><button type="button" onclick="addUrlField()" class="btn-primary" style="margin-top:10px;">+ Add URL</button></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='notes'){title.textContent='➕ Add Note';const colors=['yellow','green','blue','purple','pink','red','gray'];modal.innerHTML=`<form id="addForm" onsubmit="addNote(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required/></div><div class="form-group"><label>Category</label><input type="text" name="category" placeholder="e.g., Personal, Work, Ideas"/></div><div class="form-group"><label>Content *</label><textarea name="content" required style="min-height:200px;"></textarea></div><div class="form-group"><label>Color</label><div class="color-options">${colors.map(c=>`<div class="color-btn note-${c} ${c==='yellow'?'selected':''}" onclick="selectColor('${c}')" data-color="${c}"></div>`).join('')}</div><input type="hidden" name="color" id="noteColor" value="yellow"/></div><div class="form-group"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" name="pinned"/>Pin this note</label></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='admin'){title.textContent='➕ Create New User';modal.innerHTML=`<form id="addForm" onsubmit="addUser(event)"><div class="form-group"><label>Username *</label><input type="text" name="username" required pattern="[a-zA-Z0-9_]+" minlength="3"/></div><div class="form-group"><label>Email *</label><input type="email" name="email" required/></div><div class="form-group"><label>Password *</label><input type="password" name="password" required minlength="6"/></div><div class="form-group"><label>Role *</label><select name="role"><option value="user">User</option><option value="admin">Admin</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create User</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}document.getElementById('modalOverlay').classList.remove('hidden')};

const closeModal=()=>{document.getElementById('modalOverlay').classList.add('hidden')};

const addProject=async(e)=>{e.preventDefault();const formData=new FormData(e.target);const projectData=Object.fromEntries(formData);projectData.tags=generateTags(projectData.name);showLoading(true,'Creating...');try{const id='project_'+Date.now();await db.ref(`projects/${id}`).set({...projectData,id,createdBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created project: ${projectData.name}`);showToast('✅ Project created');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const addTask=async(e)=>{e.preventDefault();const formData=new FormData(e.target);const taskData=Object.fromEntries(formData);taskData.tags=generateTags(taskData.title);showLoading(true,'Creating...');try{const id='task_'+Date.now();await db.ref(`tasks/${id}`).set({...taskData,id,createdBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created task: ${taskData.title}`);showToast('✅ Task created');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const addDocument=async e=>{e.preventDefault();const name=e.target.elements.name.value;const description=e.target.elements.description.value;const files=Array.from(document.getElementById('fileInput').files);if(files.length===0){showToast('❌ Please select files','error');return}showLoading(true,'Uploading...');try{const fileData=files.map(f=>({name:f.name,type:f.type,size:f.size}));const id='doc_'+Date.now();await db.ref(`documents/${id}`).set({id,name,description,files:fileData,uploadedBy:currentUser.name,uploadedAt:getDateTime()});await logActivity('create',`${currentUser.name} uploaded document: ${name}`);showToast(`✅ Uploaded ${files.length} file(s)`);closeModal()}catch(error){showToast('❌ Upload failed: '+error.message,'error')}finally{showLoading(false)}};

const addUrl=async e=>{e.preventDefault();const title=e.target.elements.title.value;const links=Array.from(document.getElementById('urlsContainer').querySelectorAll('input')).map(i=>i.value).filter(Boolean);if(links.length===0){showToast('❌ Add at least one URL','error');return}showLoading(true,'Creating...');try{const id='url_'+Date.now();await db.ref(`urls/${id}`).set({id,title,links,addedBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} added URLs: ${title}`);showToast('✅ URLs added');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const addNote=async e=>{e.preventDefault();const formData=new FormData(e.target);const noteData={title:formData.get('title'),category:formData.get('category'),content:formData.get('content'),color:formData.get('color'),pinned:formData.get('pinned')==='on'};showLoading(true,'Creating...');try{const id='note_'+Date.now();await db.ref(`notes/${id}`).set({...noteData,id,createdBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created note: ${noteData.title}`);showToast('✅ Note created');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const addUser=async e=>{e.preventDefault();const formData=new FormData(e.target);const userData=Object.fromEntries(formData);showLoading(true,'Creating user...');try{const existingUser=await db.ref(`users/${userData.username}`).once('value');if(existingUser.exists()){showToast('❌ Username already exists','error');showLoading(false);return}await db.ref(`users/${userData.username}`).set({username:userData.username,password:userData.password,email:userData.email,role:userData.role,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created user: ${userData.username}`);showToast('✅ User created successfully');closeModal()}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const deleteItem=async(type,id)=>{if(!confirm(`Delete this ${type}?`))return;showLoading(true,'Deleting...');try{const path=type==='user'?`users/${id}`:`${type}s/${id}`;await db.ref(path).remove();await logActivity('delete',`${currentUser.name} deleted ${type}: ${id}`);showToast('✅ Deleted')}catch(error){showToast('❌ Error: '+error.message,'error')}finally{showLoading(false)}};

const canEdit=item=>{if(currentUser.role==='admin')return true;return item.createdBy===currentUser.name||item.uploadedBy===currentUser.name||item.addedBy===currentUser.name};

const logActivity=async(action,description)=>{try{const id='activity_'+Date.now();await db.ref(`activities/${id}`).set({id,action,description,user:currentUser.name,timestamp:getDateTime()})}catch(error){console.error('Activity log error:',error)}};

document.addEventListener('click',e=>{if(!e.target.closest('#themePicker')&&!e.target.closest('#themeToggle')){document.getElementById('themePicker').classList.add('hidden')}});

window.addEventListener('load',initFirebase);
window.addEventListener('beforeunload',e=>{if(currentUser){e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
