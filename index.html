<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyDXO6H0y9DrsQCBhEozd3D3EZhlVbv9VWw",
    authDomain: "team-hub-666f4.firebaseapp.com",

    messagingSenderId: "201156915923",
    appId: "1:201156915923:web:ba3b8f4420832a414e9a26"
};

// Global Variables
let db = null;
let currentUser = null;
let currentTab = 'home';
let data = {projects: [], tasks: [], documents: [], contacts: [], urls: [], notes: [], users: [], activities: []};
let listeners = {};
let currentViewingFile = null;
let currentViewingDoc = null;

// Utility Functions
function showLoading(show = true, text = 'Loading...') {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) {
        overlay.querySelector('.loading-text').textContent = text;
        overlay.classList.toggle('hidden', !show);
    }
}

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.className = 'toast ' + (type === 'error' ? 'error' : '');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function getDateTime() {
    return new Date().toLocaleString('en-US', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: true
    });
}

function esc(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function saveSession() {
    if (currentUser) sessionStorage.setItem('teamhub_user', JSON.stringify(currentUser));
}

function loadSession() {
    const s = sessionStorage.getItem('teamhub_user');
    if (s) {
        try {
            currentUser = JSON.parse(s);
            return true;
        } catch (e) {
            sessionStorage.removeItem('teamhub_user');
        }
    }
    return false;
}

function clearSession() {
    sessionStorage.removeItem('teamhub_user');
    currentUser = null;
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    showToast(next === 'dark' ? '🌙 Dark mode' : '☀️ Light mode');
}

// File Handling Functions
function dataURItoBlob(dataURI) {
    try {
        const arr = dataURI.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        const u8arr = new Uint8Array(bstr.length);
        for (let i = 0; i < bstr.length; i++) {
            u8arr[i] = bstr.charCodeAt(i);
        }
        return new Blob([u8arr], {type: mime});
    } catch (e) {
        console.error('Blob error:', e);
        return null;
    }
}

function downloadFile(filename, dataURI) {
    try {
        const blob = dataURItoBlob(dataURI);
        if (!blob) {
            showToast('❌ Invalid file', 'error');
            return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'download';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('✅ Downloaded');
    } catch (e) {
        showToast('❌ Download failed', 'error');
    }
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => showToast('✅ Copied'))
        .catch(() => showToast('❌ Failed', 'error'));
}

function getFileIcon(filename) {
    const ext = (filename.split('.').pop() || '').toLowerCase();
    const icons = {
        jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
        pdf: '📑', txt: '📄', md: '📄', js: '💻', py: '💻', html: '💻', css: '💻',
        json: '💻', zip: '📦', mp4: '🎬', mp3: '🎵'
    };
    return icons[ext] || '📄';
}

// View Functions
function viewFileContent(file) {
    currentViewingFile = file;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const modal = document.getElementById('modalBody');
    
    if (!file.content) {
        modal.innerHTML = '<p>No content available</p><button class="btn-cancel" onclick="closeModal()" style="width:100%;margin-top:16px">Close</button>';
        document.getElementById('modalTitle').textContent = file.name;
        document.getElementById('modalOverlay').classList.remove('hidden');
        return;
    }

    let content = '';
    const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'].includes(ext);
    const isText = ['txt', 'md', 'csv', 'log', 'xml', 'json', 'js', 'css', 'html', 'py', 'java', 'cpp', 'php'].includes(ext);

    if (isImage) {
        content = `
            <div style="text-align:center;padding:20px">
                <img src="${file.content}" style="max-width:100%;max-height:60vh;border-radius:8px" 
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <div style="display:none;color:var(--danger)">Failed to load image</div>
            </div>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="downloadCurrentFile()">Download</button>
                <button class="btn-cancel" onclick="closeModal()">Close</button>
            </div>`;
    } else if (isText) {
        let text = file.content;
        if (file.content.startsWith('data:')) {
            try {
                text = atob(file.content.split(',')[1]);
            } catch (e) {
                text = file.content;
            }
        }
        content = `
            <div class="code-highlight"><pre>${esc(text)}</pre></div>
            <div class="modal-buttons">
                <button class="btn-submit" onclick="copyCurrentFile()">Copy Text</button>
                <button class="btn-submit" onclick="downloadCurrentFile()">Download</button>
                <button class="btn-cancel" onclick="closeModal()">Close</button>
            </div>`;
    } else {
        content = `
            <div style="text-align:center;padding:40px">
                <p style="font-size:48px">📄</p>
                <p style="font-size:18px;font-weight:600">${esc(file.name)}</p>
                <p style="color:var(--text-secondary);margin:16px 0">This file type cannot be previewed</p>
                <button class="btn-submit" onclick="downloadCurrentFile()">Download File</button>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Close</button>
            </div>`;
    }

    modal.innerHTML = content;
    document.getElementById('modalTitle').textContent = '📄 ' + file.name;
    document.getElementById('modalOverlay').classList.remove('hidden');
}

function downloadCurrentFile() {
    if (currentViewingFile && currentViewingFile.content) {
        downloadFile(currentViewingFile.name, currentViewingFile.content);

}

function copyCurrentFile() {
    if (currentViewingFile && currentViewingFile.content) {
        let text = currentViewingFile.content;
        if (text.startsWith('data:')) {
            try {
                text = atob(text.split(',')[1]);

function removeEditFile(idx) {
    if (confirm('Remove this file?')) {
        window.editDocFiles.splice(idx, 1);

    }

async function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve({
            name: file.name,
            type: file.type,
            size: file.size,
            content: e.target.result
        });
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function saveDocEdit(e, id) {
    e.preventDefault();
    const form = e.target;
    const name = form.elements.name.value;
    const description = form.elements.description.value;
    
    showLoading(true, 'Saving...');
    try {
        const newFiles = document.getElementById('newFilesInput').files;
        let allFiles = [...window.editDocFiles];
        
        if (newFiles.length > 0) {
            for (let file of newFiles) {
                const data = await readFileAsBase64(file);
                allFiles.push(data);
            }
        }
        
        await db.ref(`documents/${id}`).update({
            name: name,
            description: description,
            files: allFiles
        });
        
        await logActivity('update', `${currentUser.name} updated document`);
        showToast('✅ Document saved');
        closeModal();
    } catch (err) {
        showToast('❌ Save failed', 'error');
    } finally {
        showLoading(false);
    }
}

// CRUD Operations
async function addProject(e) {
    e.preventDefault();
    const form = e.target;
    showLoading(true);
    try {
        const id = 'project_' + Date.now();
        await db.ref(`projects/${id}`).set({
            id: id,
            name: form.elements.name.value,
            description: form.elements.description.value,
            status: form.elements.status.value,
            createdBy: currentUser.name,
            createdAt: getDateTime()
        });
        await logActivity('create', `${currentUser.name} created project`);
        showToast('✅ Project created');
        closeModal();
    } catch (err) {
        showToast('❌ Error', 'error');
    } finally {
        showLoading(false);
    }
}

async function addTask(e) {
    e.preventDefault();
    const form = e.target;
    showLoading(true);
    try {
        const id = 'task_' + Date.now();
        await db.ref(`tasks/${id}`).set({
            id: id,
            title: form.elements.title.value,
            description: form.elements.description.value,
            priority: form.elements.priority.value,
            status: form.elements.status.value,
            createdBy: currentUser.name,
            createdAt: getDateTime()
        });
        await logActivity('create', `${currentUser.name} created task`);
        showToast('✅ Task created');
        closeModal();
    } catch (err) {
        showToast('❌ Error', 'error');
    } finally {
        showLoading(false);
    }
}

async function addDocument(e) {
    e.preventDefault();
    const form = e.target;
    const files = Array.from(document.getElementById('docFiles').files);
    if (!files.length) {
        showToast('❌ Select files', 'error');
        return;
    }
    
    showLoading(true, 'Uploading...');
    try {
        const fileData = [];
        for (let file of files) {
            const data = await readFileAsBase64(file);
            fileData.push(data);
        }
        
        const id = 'doc_' + Date.now();
        await db.ref(`documents/${id}`).set({
            id: id,
            name: form.elements.name.value,
            description: form.elements.description.value,
            files: fileData,
            uploadedBy: currentUser.name,
            uploadedAt: getDateTime()
        });
        await logActivity('create', `${currentUser.name} uploaded document`);
        showToast(`✅ Uploaded ${files.length} files`);
        closeModal();
    } catch (err) {
        showToast('❌ Upload failed', 'error');
    } finally {
        showLoading(false);
    }
}

async function addUrl(e) {
    e.preventDefault();
    const form = e.target;
    const inputs = document.querySelectorAll('#urlInputs input');
    const links = Array.from(inputs).map(i => i.value).filter(v => v);
    
    if (!links.length) {
        showToast('❌ Add at least one URL', 'error');
        return;
    }
    
    showLoading(true);
    try {
        const id = 'url_' + Date.now();
        await db.ref(`urls/${id}`).set({
            id: id,
            title: form.elements.title.value,
            links: links,
            addedBy: currentUser.name,
            createdAt: getDateTime()
        });
        await logActivity('create', `${currentUser.name} added URLs`);
        showToast('✅ URLs added');
        closeModal();
    } catch (err) {
        showToast('❌ Error', 'error');
    } finally {
        showLoading(false);
    }
}

async function deleteItem(type, id) {
    if (!confirm(`Delete this ${type}?`)) return;
    showLoading(true);
    try {
        await db.ref(`${type}s/${id}`).remove();
        await logActivity('delete', `${currentUser.name} deleted ${type}`);
        showToast('✅ Deleted');
    } catch (err) {
        showToast('❌ Error', 'error');
    } finally {
        showLoading(false);
    }
}

function canDelete(item) {
    if (currentUser.role === 'admin') return true;
    return item.createdBy === currentUser.name || 
           item.uploadedBy === currentUser.name || 
           item.addedBy === currentUser.name;
}

async function logActivity(action, description) {
    try {
        await db.ref(`activities/activity_${Date.now()}`).set({
            action: action,
            description: description,
            user: currentUser.name,
            timestamp: getDateTime()
        });
    } catch (e) {
        console.error('Activity log error:', e);
    }
}

// Initialization
async function initFirebase() {
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        
        // Check if users exist
        const usersSnap = await db.ref('users').once('value');
        if (!usersSnap.exists()) {
            await db.ref('users').set({
                admin: {
                    username: 'admin',
                    password: 'admin123',
                    email: 'admin@team.com',
                    role: 'admin',
                    createdAt: getDateTime()
                },
                user1: {
                    username: 'user1',
                    password: 'user123',
                    email: 'user@team.com',
                    role: 'user',
                    createdAt: getDateTime()
                }
            });
        }
        
        setupListeners();
        
        // Apply theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        // Check session
        if (loadSession()) {
            showDashboard();
            showToast('✅ Welcome back!');
        } else {
            showLoading(false);
            document.getElementById('loginPage').classList.remove('hidden');
        }
    } catch (err) {
        console.error('Init error:', err);
        showLoading(false);
        showToast('❌ Failed to initialize', 'error');
        document.getElementById('loginPage').classList.remove('hidden');
    }
}

function setupListeners() {
    ['projects', 'tasks', 'documents', 'contacts', 'urls', 'notes', 'users', 'activities'].forEach(type => {
        listeners[type] = db.ref(type).on('value', snap => {
            const val = snap.val();
            data[type] = val ? Object.values(val) : [];
            if (currentUser) renderContent();
        });
    });
}

function removeListeners() {
    Object.keys(listeners).forEach(key => {
        if (listeners[key]) db.ref(key).off('value', listeners[key]);
    });
    listeners = {};
}

// Event Listeners
document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn = document.getElementById('loginBtn');
    
    if (!username || !password) {
        showToast('❌ Enter credentials', 'error');
        return;
    }
    
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    
    try {
        const snap = await db.ref('users').once('value');
        const users = snap.val() ? Object.values(snap.val()) : [];
        const user = users.find(u => u.username === username && u.password === password);
        
        if (user) {
            currentUser = {
                name: user.username,
                role: user.role,
                email: user.email
            };
            await db.ref(`users/${username}/lastLogin`).set(getDateTime());
            await logActivity('login', `${username} logged in`);
            saveSession();
            showDashboard();
            showToast(`✅ Welcome ${username}!`);
        } else {
            showToast('❌ Invalid credentials', 'error');
        }
    } catch (err) {
        showToast('❌ Login failed', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
    if (!confirm('Logout?')) return;
    await logActivity('logout', `${currentUser.name} logged out`);
    removeListeners();
    clearSession();
    showToast('✅ Logged out');
    setTimeout(() => {
        document.getElementById('loginPage').classList.remove('hidden');
        document.getElementById('dashboardPage').classList.add('hidden');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        currentTab = 'home';
    }, 800);
});

function showDashboard() {
    showLoading(false);
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    document.getElementById('currentUserName').textContent = currentUser.name;
    document.getElementById('currentUserRole').textContent = currentUser.role;
    initSidebar();
    switchTab('home');
}

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('searchInput').value = '';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
    
    const hideAdd = ['home', 'admin', 'contacts'];
    document.getElementById('addNewBtn').classList.toggle('hidden', hideAdd.includes(tab));
    
    const labels = {projects: 'Project', tasks: 'Task', documents: 'Document', urls: 'URL', notes: 'Note'};
    document.getElementById('addBtnText').textContent = labels[tab] ? 'Add ' + labels[tab] : 'Add';
    
    renderContent();
}

function performSearch() {
    renderContent();
}

function renderContent() {
    if (currentTab === 'home') renderHome();
    else if (currentTab === 'projects') renderProjects();
    else if (currentTab === 'tasks') renderTasks();
    else if (currentTab === 'documents') renderDocuments();
    else if (currentTab === 'contacts') renderContacts();
    else if (currentTab === 'urls') renderUrls();
    else if (currentTab === 'notes') renderNotes();
    else if (currentTab === 'admin') renderAdmin();
}

// Start
window.addEventListener('load', initFirebase);
