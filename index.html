<script>
const firebaseConfig={apiKey:"AIzaSyDXO6H0y9DrsQCBhEozd3D3EZhlVbv9VWw",authDomain:"team-hub-666f4.firebaseapp.com",databaseURL:"https://team-hub-666f4-default-rtdb.firebaseio.com",projectId:"team-hub-666f4",storageBucket:"team-hub-666f4.firebasestorage.app",messagingSenderId:"201156915923",appId:"1:201156915923:web:ba3b8f4420832a414e9a26"};

function dataURItoBlob(dataURI){try{const arr=dataURI.split(',');const mime=arr[0].match(/:(.*?);/)[1];const bstr=atob(arr[1]);let n=bstr.length;const u8arr=new Uint8Array(n);while(n--){u8arr[n]=bstr.charCodeAt(n)}return new Blob([u8arr],{type:mime})}catch(e){console.error('Blob error',e);return null}}

const downloadFile=(filename,dataURI)=>{try{const blob=dataURItoBlob(dataURI);if(!blob){showToast('❌ File error','error');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('✅ Downloaded')}catch(e){showToast('❌ Failed','error')}};

const copyToClipboard=text=>{navigator.clipboard.writeText(text).then(()=>showToast('✅ Copied')).catch(()=>showToast('❌ Failed','error'))};

const highlightCode=(code,lang)=>{if(!code)return'';const keywords={'js':['function','const','let','var','if','else','return','for','while'],'py':['def','class','if','else','return','import']};let h=esc(code);if(keywords[lang]){keywords[lang].forEach(kw=>{h=h.replace(new RegExp(`\\b${kw}\\b`,'g'),`<span style="color:#667eea;font-weight:bold;">${kw}</span>`)})}return h};

const viewFileContent=file=>{currentViewingFile=file;const ext=(file.name.split('.').pop()||'').toLowerCase();const modal=document.getElementById('modalBody');if(!file.content){modal.innerHTML='<div style="text-align:center;padding:40px;"><p>No content</p></div><button class="btn-cancel" onclick="closeModal()" style="width:100%">Close</button>';document.getElementById('modalTitle').textContent=file.name;document.getElementById('modalOverlay').classList.remove('hidden');return}let content='';if(['jpg','jpeg','png','gif','webp','svg'].includes(ext)){content=`<div style="text-align:center;padding:20px"><img src="${file.content}" style="max-width:100%;max-height:60vh;border-radius:8px" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div style="display:none;color:var(--danger)">Failed to load</div></div><div class="modal-buttons"><button class="btn-submit" onclick="downloadCurrentFile()">Download</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`}else if(['txt','md','csv','js','py','html','css','json'].includes(ext)){let text=file.content;if(file.content.startsWith('data:')){try{text=atob(file.content.split(',')[1])}catch(e){}}const display=['js','py','html','css','json'].includes(ext)?highlightCode(text,ext):esc(text);content=`<div style="background:var(--bg-tertiary);padding:20px;border-radius:8px;max-height:400px;overflow:auto"><pre>${display}</pre></div><div class="modal-buttons"><button class="btn-submit" onclick="copyToClipboard(atob('${btoa(unescape(encodeURIComponent(text))}'))">Copy</button><button class="btn-submit" onclick="downloadCurrentFile()">Download</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`}else{content=`<div style="text-align:center;padding:40px"><p style="font-size:48px">📄</p><p>${esc(file.name)}</p><button class="btn-submit" onclick="downloadCurrentFile()">Download</button></div><div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Close</button></div>`}modal.innerHTML=content;document.getElementById('modalTitle').textContent=file.name;document.getElementById('modalOverlay').classList.remove('hidden')};

const downloadCurrentFile=()=>{if(currentViewingFile&&currentViewingFile.content){downloadFile(currentViewingFile.name,currentViewingFile.content)}};

const getFileIcon=fn=>{const ext=(fn.split('.').pop()||'').toLowerCase();const icons={'jpg':'🖼️','png':'🖼️','gif':'🖼️','pdf':'📑','txt':'📄','js':'💻','py':'💻','html':'💻','zip':'📦'};return icons[ext]||'📄'};

const viewDocument=doc=>{currentViewingDoc=doc;const modal=document.getElementById('modalBody');const files=doc.files||[];let filesHtml='';files.forEach((f,i)=>{filesHtml+=`<tr><td style="padding:12px">${getFileIcon(f.name)} ${esc(f.name)}</td><td style="padding:12px">${((f.size||0)/1024).toFixed(1)}KB</td><td style="padding:12px"><button class="btn-icon" onclick="viewDocFile(${i})">👁️</button><button class="btn-icon" onclick="downloadDocFile(${i})">⬇️</button></td></tr>`});modal.innerHTML=`<div class="detail-row"><div class="detail-label">Name</div><div class="detail-value">${esc(doc.name)}</div></div><div class="detail-row"><div class="detail-label">Description</div><div class="detail-value">${esc(doc.description)||'No description'}</div></div><div style="margin-top:20px"><div class="detail-label">Files (${files.length})</div><table style="width:100%;background:var(--bg-tertiary);border-radius:8px;margin-top:10px"><thead style="background:var(--bg-secondary)"><tr><th style="padding:12px;text-align:left">Name</th><th style="padding:12px;text-align:left">Size</th><th style="padding:12px;text-align:left">Actions</th></tr></thead><tbody>${filesHtml}</tbody></table></div>${canDelete(doc)?`<div class="modal-buttons"><button class="btn-submit" onclick="editCurrentDocument()">Edit</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`:`<button class="btn-cancel" onclick="closeModal()" style="width:100%;margin-top:16px">Close</button>`}`;document.getElementById('modalTitle').textContent='📄 Document';document.getElementById('modalOverlay').classList.remove('hidden')};

const viewDocFile=i=>{if(currentViewingDoc&&currentViewingDoc.files[i]){viewFileContent(currentViewingDoc.files[i])}};
const downloadDocFile=i=>{if(currentViewingDoc&&currentViewingDoc.files[i]){const f=currentViewingDoc.files[i];downloadFile(f.name,f.content)}};
const editCurrentDocument=()=>{if(currentViewingDoc)editDocument(currentViewingDoc)};

const editDocument=doc=>{const modal=document.getElementById('modalBody');const filesHtml=doc.files.map((f,i)=>`<div class="file-item" id="file-${i}"><div style="display:flex;align-items:center;gap:8px"><span>${getFileIcon(f.name)}</span><div><div>${esc(f.name)}</div><div style="font-size:11px;color:var(--text-secondary)">${((f.size||0)/1024).toFixed(1)}KB</div></div></div><button class="btn-icon" onclick="removeFileFromEdit(${i})">🗑️</button></div>`).join('');modal.innerHTML=`<form id="editDocForm" onsubmit="saveDocumentEdits(event,'${doc.id}')"><div class="form-group"><label>Name *</label><input type="text" name="name" value="${esc(doc.name)}" required></div><div class="form-group"><label>Description</label><textarea name="description">${esc(doc.description)||''}</textarea></div><div class="form-group"><label>Current Files (${doc.files.length})</label><div id="currentFilesList">${filesHtml}</div></div><div class="form-group"><label>Add Files</label><input type="file" id="newFilesInput" multiple></div><div class="modal-buttons"><button type="submit" class="btn-submit">Save</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`;window.currentDocFiles=[...doc.files];document.getElementById('modalTitle').textContent='✏️ Edit Document';document.getElementById('modalOverlay').classList.remove('hidden')};

const removeFileFromEdit=i=>{if(confirm('Remove?')){window.currentDocFiles.splice(i,1);const el=document.getElementById(`file-${i}`);if(el)el.remove()}};

const readFileAsBase64=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=e=>resolve({name:file.name,type:file.type,size:file.size,content:e.target.result});r.onerror=reject;r.readAsDataURL(file)});

const saveDocumentEdits=async(e,id)=>{e.preventDefault();const fd=new FormData(e.target);const docData={name:fd.get('name'),description:fd.get('description')};showLoading(true);try{const doc=data.documents.find(d=>d.id===id);const nf=document.getElementById('newFilesInput').files;let allFiles=[...window.currentDocFiles];if(nf.length>0){for(let i=0;i<nf.length;i++){const d=await readFileAsBase64(nf[i]);allFiles.push(d)}}await db.ref(`documents/${id}`).set({...doc,name:docData.name,description:docData.description,files:allFiles});await logActivity('update',`${currentUser.name} updated doc`);showToast('✅ Saved');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const renderNotes=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.notes.filter(n=>(n.title||'').toLowerCase().includes(s)||(n.content||'').toLowerCase().includes(s));const p=f.filter(n=>n.pinned),r=f.filter(n=>!n.pinned);let h='';if(p.length){h+=`<h3 style="margin-bottom:12px">📌 Pinned</h3><div class="grid">`+p.map(n=>renderNoteCard(n)).join('')+'</div>'}if(r.length){h+=`<h3 style="margin:20px 0 12px">📝 All Notes</h3><div class="grid">`+r.map(n=>renderNoteCard(n)).join('')+'</div>'}if(!f.length)h='<p style="text-align:center;padding:40px;color:var(--text-secondary)">No notes</p>';document.getElementById('contentContainer').innerHTML=h};

const renderNoteCard=n=>`<div class="card note-card ${n.pinned?'pinned':''}" style="background:${n.color||'#fff'}"><div class="card-header"><div class="card-title">${esc(n.title)}</div><div class="card-actions"><button class="btn-icon view" onclick="viewNoteById('${n.id}')">👁️</button>${canDelete(n)?`<button class="btn-icon delete" onclick="deleteItem('note','${n.id}')">🗑️</button>`:''}</div></div><div class="note-preview"><p class="card-description">${(n.content||'').substring(0,120)}...</p></div>${n.tags?`<div class="tag-container">${n.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}<p class="card-meta">${n.category||'General'} • ${esc(n.createdBy)}</p></div>`;

const viewNoteById=id=>{const n=data.notes.find(x=>x.id===id);if(n)viewNote(n)};
const viewNote=n=>{document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">Title</div><div class="detail-value">${esc(n.title)}</div></div><div class="detail-row"><div class="detail-label">Content</div><div class="detail-value" style="white-space:pre-wrap">${esc(n.content)}</div></div>${canDelete(n)?`<div class="modal-buttons"><button class="btn-submit" onclick="editNoteById('${n.id}')">Edit</button><button class="btn-submit" onclick="togglePinNote('${n.id}',${!n.pinned})">${n.pinned?'Unpin':'Pin'}</button><button class="btn-cancel" onclick="closeModal()">Close</button></div>`:`<button class="btn-cancel" onclick="closeModal()" style="width:100%">Close</button>`}`;document.getElementById('modalTitle').textContent='📝 Note';document.getElementById('modalOverlay').classList.remove('hidden')};
const editNoteById=id=>{const n=data.notes.find(x=>x.id===id);if(n)editNote(n)};

const editNote=n=>{const colors=['#ffffff','#fef3c7','#dbeafe','#d1fae5','#e9d5ff','#fed7aa','#fee2e2'];document.getElementById('modalBody').innerHTML=`<form id="editNoteForm" onsubmit="saveNote(event,'${n.id}')"><div class="form-group"><label>Title *</label><input type="text" name="title" value="${esc(n.title)}" required></div><div class="form-group"><label>Category</label><input type="text" name="category" value="${esc(n.category)||''}"></div><div class="form-group"><label>Tags</label><input type="text" name="tags" value="${(n.tags||[]).join(', ')}"></div><div class="form-group"><label>Color</label><div class="color-picker">${colors.map(c=>`<div class="color-option ${n.color===c?'selected':''}" style="background:${c}" onclick="selectColor(this,'${c}')"></div>`).join('')}</div><input type="hidden" name="color" id="selectedColor" value="${n.color||'#ffffff'}"></div><div class="form-group"><label>Content *</label><textarea name="content" required style="min-height:200px">${esc(n.content)}</textarea></div><div class="modal-buttons"><button type="submit" class="btn-submit">Save</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`;document.getElementById('modalTitle').textContent='✏️ Edit Note'};
const selectColor=(el,c)=>{document.querySelectorAll('.color-option').forEach(o=>o.classList.remove('selected'));el.classList.add('selected');document.getElementById('selectedColor').value=c};
const togglePinNote=async(id,pin)=>{showLoading(true);try{const n=data.notes.find(x=>x.id===id);await db.ref(`notes/${id}`).update({pinned:pin});showToast(pin?'📌 Pinned':'📌 Unpinned');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const saveNote=async(e,id)=>{e.preventDefault();const fd=new FormData(e.target);const nd={title:fd.get('title'),category:fd.get('category'),color:fd.get('color'),content:fd.get('content'),tags:fd.get('tags')?fd.get('tags').split(',').map(t=>t.trim()).filter(t=>t):[]};showLoading(true);try{await db.ref(`notes/${id}`).update(nd);await logActivity('update',`${currentUser.name} updated note`);showToast('✅ Saved');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const addNote=async e=>{e.preventDefault();const fd=new FormData(e.target);const nd={title:fd.get('title'),category:fd.get('category'),color:fd.get('color'),content:fd.get('content'),tags:fd.get('tags')?fd.get('tags').split(',').map(t=>t.trim()).filter(t=>t):[],id:'note_'+Date.now(),createdBy:currentUser.name,createdAt:getDateTime(),pinned:false};showLoading(true);try{await db.ref(`notes/${nd.id}`).set(nd);await logActivity('create',`${currentUser.name} created note`);showToast('✅ Created');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const renderHome=()=>{const c=document.getElementById('contentContainer');const s=document.getElementById('searchInput').value.toLowerCase();if(s){let h=`<h2>Search: "${esc(s)}"</h2>`;const r={projects:data.projects.filter(p=>(p.name||'').toLowerCase().includes(s)),tasks:data.tasks.filter(t=>(t.title||'').toLowerCase().includes(s)),docs:data.documents.filter(d=>(d.name||'').toLowerCase().includes(s)),contacts:data.contacts.filter(x=>(x.name||'').toLowerCase().includes(s)),urls:data.urls.filter(u=>(u.title||'').toLowerCase().includes(s)),notes:data.notes.filter(n=>(n.title||'').toLowerCase().includes(s))};Object.entries({📁:r.projects,'✅':r.tasks,📄:r.docs,👥:r.contacts,🔗:r.urls,📝:r.notes}).forEach(([k,v])=>{if(v.length)h+=`<h3>${k} (${v.length})</h3><div class="grid">`+v.map(i=>`<div class="card"><div class="card-title">${esc(i.name||i.title)}</div></div>`).join('')+'</div>'});if(!Object.values(r).some(x=>x.length))h+='<p style="text-align:center;padding:40px">No results</p>';c.innerHTML=h;return}c.innerHTML=`<div class="stats-grid"><div class="stat-card blue" onclick="switchTab('projects')"><div class="stat-number blue">${data.projects.length}</div><div class="stat-label">Projects</div></div><div class="stat-card green" onclick="switchTab('tasks')"><div class="stat-number green">${data.tasks.length}</div><div class="stat-label">Tasks</div></div><div class="stat-card purple" onclick="switchTab('documents')"><div class="stat-number purple">${data.documents.length}</div><div class="stat-label">Documents</div></div><div class="stat-card orange" onclick="switchTab('contacts')"><div class="stat-number orange">${data.contacts.length}</div><div class="stat-label">Contacts</div></div></div><h2 style="margin:24px 0">Welcome, ${esc(currentUser.name)}!</h2><h3>📁 Recent Projects</h3><div class="grid">${data.projects.slice(-5).reverse().map(p=>`<div class="card"><div class="card-title">${esc(p.name)}</div><p class="card-meta">${p.status}</p></div>`).join('')||'<p style="color:var(--text-secondary)">None</p>'}</div>`};

const initFirebase=async()=>{showLoading(true,'Initializing...');try{firebase.initializeApp(firebaseConfig);db=firebase.database();const snap=await db.ref('users').once('value');if(!snap.exists()){await db.ref('users').set({admin:{username:'admin',password:'admin123',email:'admin@team.com',role:'admin',createdAt:getDateTime()},user1:{username:'user1',password:'user123',email:'user@team.com',role:'user',createdAt:getDateTime()}})}setupListeners();const th=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',th);if(loadSession()){showDashboard();showToast('✅ Welcome back!')}else{showLoading(false);document.getElementById('loginPage').classList.remove('hidden')}}catch(e){console.error(e);showLoading(false);showToast('❌ Init failed','error');document.getElementById('loginPage').classList.remove('hidden')}};

const setupListeners=()=>{['projects','tasks','documents','contacts','urls','notes','users','activities'].forEach(t=>{listeners[t]=db.ref(t).on('value',s=>{data[t]=s.val()?Object.values(s.val()):[];if(currentUser)renderContent()})})};

const removeListeners=()=>{Object.keys(listeners).forEach(k=>{if(listeners[k])db.ref(k).off('value',listeners[k])});listeners={}};

document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.getElementById('username').value.trim();const p=document.getElementById('password').value.trim();const btn=document.getElementById('loginBtn');if(!u||!p){showToast('❌ Enter credentials','error');return}btn.disabled=true;btn.textContent='Signing in...';try{const snap=await db.ref('users').once('value');const users=snap.val()?Object.values(snap.val()):[];const user=users.find(x=>x.username===u&&x.password===p);if(user){currentUser={name:user.username,role:user.role,email:user.email};await db.ref(`users/${u}/lastLogin`).set(getDateTime());await logActivity('login',`${u} logged in`);saveSession();showDashboard();showToast(`✅ Welcome ${u}!`)}else{showToast('❌ Invalid','error')}}catch(e){showToast('❌ Error','error')}finally{btn.disabled=false;btn.textContent='Sign In'}});

const showDashboard=()=>{showLoading(false);document.getElementById('loginPage').classList.add('hidden');document.getElementById('dashboardPage').classList.remove('hidden');document.getElementById('currentUserName').textContent=currentUser.name;document.getElementById('currentUserRole').textContent=currentUser.role;initSidebar();switchTab('home')};

document.getElementById('logoutBtn').addEventListener('click',async()=>{if(!confirm('Logout?'))return;await logActivity('logout',`${currentUser.name} logged out`);removeListeners();clearSession();showToast('✅ Logged out');setTimeout(()=>{document.getElementById('loginPage').classList.remove('hidden');document.getElementById('dashboardPage').classList.add('hidden');document.getElementById('username').value='';document.getElementById('password').value='';currentTab='home'},800)});

"round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"/></svg>${t.label}</button>`).join('')};

const switchTab=tab=>{currentTab=tab;document.getElementById('searchInput').value='';document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');const hide=['home','admin','contacts'];document.getElementById('addNewBtn').classList.toggle('hidden',hide.includes(tab));const labels={projects:'Project',tasks:'Task',documents:'Document',urls:'URL',notes:'Note'};document.getElementById('addBtnText').textContent=labels[tab]?'Add '+labels[tab]:'Add';renderContent()};

const performSearch=()=>renderContent();
const renderContent=()=>{if(currentTab==='home')renderHome();else if(currentTab==='projects')renderProjects();else if(currentTab==='tasks')renderTasks();else if(currentTab==='documents')renderDocuments();else if(currentTab==='contacts')renderContacts();else if(currentTab==='urls')renderUrls();else if(currentTab==='notes')renderNotes();else if(currentTab==='admin')renderAdmin()};

const renderProjects=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.projects.filter(p=>(p.name||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div class="grid">${f.map(p=>`<div class="card"><div class="card-header"><div class="card-title">${esc(p.name)}</div><div class="card-actions"><button class="btn-icon view" onclick="viewProjectById('${p.id}')">👁️</button>${canDelete(p)?`<button class="btn-icon delete" onclick="deleteItem('project','${p.id}')">🗑️</button>`:''}</div></div><p class="card-description">${(p.description||'').substring(0,100)}...</p><div class="card-footer"><span class="badge badge-${p.status==='Active'?'green':'purple'}">${p.status}</span></div></div>`).join('')||'<p style="text-align:center;padding:40px">No projects</p>'}</div>`};

const viewProjectById=id=>{const p=data.projects.find(x=>x.id===id);if(p)viewProject(p)};
const viewProject=p=>{document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">Name</div><div class="detail-value">${esc(p.name)}</div></div><div class="detail-row"><div class="detail-label">Description</div><div class="detail-value">${esc(p.description)}</div></div><div class="detail-row"><div class="detail-label">Status</div><div class="detail-value"><span class="badge badge-${p.status==='Active'?'green':'purple'}">${p.status}</span></div></div><button class="btn-cancel" onclick="closeModal()" style="width:100%">Close</button>`;document.getElementById('modalTitle').textContent='📁 Project';document.getElementById('modalOverlay').classList.remove('hidden')};

const renderTasks=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.tasks.filter(t=>(t.title||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div class="grid">${f.map(t=>`<div class="card"><div class="card-header"><div class="card-title">${esc(t.title)}</div><div class="card-actions"><button class="btn-icon view" onclick="viewTaskById('${t.id}')">👁️</button>${canDelete(t)?`<button class="btn-icon delete" onclick="deleteItem('task','${t.id}')">🗑️</button>`:''}</div></div><p class="card-description">${(t.description||'').substring(0,100)}...</p><div class="card-footer"><span class="badge badge-${t.priority==='Urgent'?'red':'orange'}">${t.priority}</span><span class="badge badge-${t.status==='Completed'?'purple':'blue'}">${t.status}</span></div></div>`).join('')||'<p style="text-align:center;padding:40px">No tasks</p>'}</div>`};

const viewTaskById=id=>{const t=data.tasks.find(x=>x.id===id);if(t)viewTask(t)};
const viewTask=t=>{document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">Title</div><div class="detail-value">${esc(t.title)}</div></div><div class="detail-row"><div class="detail-label">Description</div><div class="detail-value">${esc(t.description)||'N/A'}</div></div><div class="detail-row"><div class="detail-label">Priority</div><div class="detail-value"><span class="badge badge-${t.priority==='Urgent'?'red':'orange'}">${t.priority}</span></div></div><div class="detail-row"><div class="detail-label">Status</div><div class="detail-value"><span class="badge badge-${t.status==='Completed'?'purple':'blue'}">${t.status}</span></div></div><button class="btn-cancel" onclick="closeModal()" style="width:100%">Close</button>`;document.getElementById('modalTitle').textContent='✅ Task';document.getElementById('modalOverlay').classList.remove('hidden')};

const renderDocuments=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.documents.filter(d=>(d.name||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div class="grid">${f.map(d=>`<div class="card"><div class="card-header"><div class="card-title">${esc(d.name)}</div><div class="card-actions"><button class="btn-icon view" onclick="viewDocumentById('${d.id}')">👁️</button>${canDelete(d)?`<button class="btn-icon delete" onclick="deleteItem('document','${d.id}')">🗑️</button>`:''}</div></div><p class="card-meta">📄 ${d.files?.length||0} files • ${esc(d.uploadedBy)}</p></div>`).join('')||'<p style="text-align:center;padding:40px">No documents</p>'}</div>`};

const viewDocumentById=id=>{const d=data.documents.find(x=>x.id===id);if(d)viewDocument(d)};
const renderContacts=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.contacts.filter(c=>(c.name||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div class="grid">${f.map(c=>`<div class="card"><div class="card-header"><div><div class="card-title">${esc(c.name)}</div><p style="color:var(--text-secondary);font-size:13px">${esc(c.company)}</p></div></div><p class="card-meta">✉️ ${esc(c.email)}</p></div>`).join('')||'<p style="text-align:center;padding:40px">No contacts</p>'}</div>`};

const renderUrls=()=>{const s=document.getElementById('searchInput').value.toLowerCase();const f=data.urls.filter(u=>(u.title||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div class="grid">${f.map(u=>`<div class="card"><div class="card-header"><div class="card-title">${esc(u.title)}</div><div class="card-actions"><button class="btn-icon view" onclick="viewUrlById('${u.id}')">👁️</button>${canDelete(u)?`<button class="btn-icon delete" onclick="deleteItem('url','${u.id}')">🗑️</button>`:''}</div></div><p class="card-meta">🔗 ${u.links?.length||0} links</p></div>`).join('')||'<p style="text-align:center;padding:40px">No URLs</p>'}</div>`};

const viewUrlById=id=>{const u=data.urls.find(x=>x.id===id);if(u)viewUrl(u)};
const viewUrl=u=>{const links=(u.links||[]).map(l=>`<div style="padding:10px;background:var(--bg-tertiary);border-radius:8px;margin-bottom:8px"><a href="${esc(l)}" target="_blank" style="color:var(--primary)">${esc(l)}</a></div>`).join('');document.getElementById('modalBody').innerHTML=`<div class="detail-row"><div class="detail-label">Title</div><div class="detail-value">${esc(u.title)}</div></div><div class="detail-label">Links</div>${links}<button class="btn-cancel" onclick="closeModal()" style="width:100%;margin-top:16px">Close</button>`;document.getElementById('modalTitle').textContent='🔗 URLs';document.getElementById('modalOverlay').classList.remove('hidden')};

const renderAdmin=()=>{if(currentUser.role!=='admin')return;const s=document.getElementById('searchInput').value.toLowerCase();const f=data.users.filter(u=>(u.username||'').toLowerCase().includes(s));document.getElementById('contentContainer').innerHTML=`<div style="background:var(--card-bg);border-radius:14px;padding:20px;border:1px solid var(--border-color)"><h2 style="font-size:18px;margin-bottom:16px">Users</h2><table style="width:100%"><thead style="background:var(--bg-tertiary)"><tr><th style="padding:12px;text-align:left">User</th><th style="padding:12px;text-align:left">Role</th></tr></thead><tbody>${f.map(u=>`<tr><td style="padding:12px">${esc(u.username)}</td><td style="padding:12px"><span class="badge badge-${u.role==='admin'?'purple':'green'}">${u.role}</span></td></tr>`).join('')}</tbody></table></div>`};

const openModal=()=>{const m=document.getElementById('modalBody'),t=document.getElementById('modalTitle');if(currentTab==='projects'){t.textContent='Add Project';m.innerHTML=`<form id="addForm" onsubmit="addProject(event)"><div class="form-group"><label>Name *</label><input type="text" name="name" required></div><div class="form-group"><label>Description *</label><textarea name="description" required></textarea></div><div class="form-group"><label>Status</label><select name="status"><option>Active</option><option>In Progress</option><option>Completed</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='tasks'){t.textContent='Add Task';m.innerHTML=`<form id="addForm" onsubmit="addTask(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Priority</label><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option></select></div><div class="form-group"><label>Status</label><select name="status"><option>To Do</option><option>In Progress</option><option>Completed</option></select></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='documents'){t.textContent='Upload Document';m.innerHTML=`<form id="addForm" onsubmit="addDocument(event)"><div class="form-group"><label>Name *</label><input type="text" name="name" required></div><div class="form-group"><label>Description</label><textarea name="description"></textarea></div><div class="form-group"><label>Files *</label><input type="file" id="fileInput" multiple required></div><div class="modal-buttons"><button type="submit" class="btn-submit">Upload</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='urls'){t.textContent='Add URLs';m.innerHTML=`<form id="addForm" onsubmit="addUrl(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required></div><div class="form-group"><label>URLs</label><div id="urlsContainer"><input type="url" placeholder="https://example.com" required style="margin-bottom:8px"></div><button type="button" onclick="addUrlField()" class="btn-primary" style="margin-top:10px">+ Add URL</button></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}else if(currentTab==='notes'){t.textContent='Add Note';m.innerHTML=`<form id="addForm" onsubmit="addNote(event)"><div class="form-group"><label>Title *</label><input type="text" name="title" required></div><div class="form-group"><label>Category</label><input type="text" name="category"></div><div class="form-group"><label>Tags</label><input type="text" name="tags" placeholder="tag1, tag2"></div><div class="form-group"><label>Content *</label><textarea name="content" required style="min-height:200px"></textarea></div><div class="modal-buttons"><button type="submit" class="btn-submit">Create</button><button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button></div></form>`}document.getElementById('modalOverlay').classList.remove('hidden')};

const closeModal=()=>{document.getElementById('modalOverlay').classList.add('hidden');currentViewingFile=null;currentViewingDoc=null};

const addProject=async e=>{e.preventDefault();const fd=new FormData(e.target);const d=Object.fromEntries(fd);showLoading(true);try{const id='project_'+Date.now();await db.ref(`projects/${id}`).set({...d,id,createdBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created project`);showToast('✅ Created');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const addTask=async e=>{e.preventDefault();const fd=new FormData(e.target);const d=Object.fromEntries(fd);showLoading(true);try{const id='task_'+Date.now();await db.ref(`tasks/${id}`).set({...d,id,createdBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} created task`);showToast('✅ Created');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const addDocument=async e=>{e.preventDefault();const name=e.target.elements.name.value;const desc=e.target.elements.description.value;const files=Array.from(document.getElementById('fileInput').files);if(!files.length){showToast('❌ Select files','error');return}showLoading(true);try{const fd=[];for(let f of files){const r=await readFileAsBase64(f);fd.push(r)}const id='doc_'+Date.now();await db.ref(`documents/${id}`).set({id,name,description:desc,files:fd,uploadedBy:currentUser.name,uploadedAt:getDateTime()});await logActivity('create',`${currentUser.name} uploaded doc`);showToast(`✅ Uploaded ${files.length} files`);closeModal()}catch(e){showToast('❌ Upload failed','error')}finally{showLoading(false)}};

const addUrlField=()=>{const d=document.createElement('div');d.innerHTML=`<input type="url" placeholder="https://example.com" required style="margin-bottom:8px;width:100%">`;document.getElementById('urlsContainer').appendChild(d)};

const addUrl=async e=>{e.preventDefault();const title=e.target.elements.title.value;const links=Array.from(document.querySelectorAll('#urlsContainer input')).map(i=>i.value).filter(Boolean);if(!links.length){showToast('❌ Add URL','error');return}showLoading(true);try{const id='url_'+Date.now();await db.ref(`urls/${id}`).set({id,title,links,addedBy:currentUser.name,createdAt:getDateTime()});await logActivity('create',`${currentUser.name} added URLs`);showToast('✅ Added');closeModal()}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const deleteItem=async(type,id)=>{if(!confirm('Delete?'))return;showLoading(true);try{await db.ref(`${type}s/${id}`).remove();await logActivity('delete',`${currentUser.name} deleted ${type}`);showToast('✅ Deleted')}catch(e){showToast('❌ Error','error')}finally{showLoading(false)}};

const canDelete=item=>currentUser.role==='admin'||item.createdBy===currentUser.name||item.uploadedBy===currentUser.name||item.addedBy===currentUser.name;

const logActivity=async(action,desc)=>{try{await db.ref(`activities/activity_${Date.now()}`).set({action,description:desc,user:currentUser.name,timestamp:getDateTime()})}catch(e){console.error(e)}};

window.addEventListener('load',initFirebase);
</script>
</body>
</html>
