<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Hub - Complete Platform</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        /* CSS preserved exactly as provided */
        :root { --primary: #2563eb; --bg-main: #f8fafc; --bg-card: #ffffff; --bg-tertiary: #f1f5f9; --text-main: #1e293b; --text-secondary: #64748b; --border: #e2e8f0; }
        [data-theme="dark"] { --bg-main: #0f172a; --bg-card: #1e293b; --bg-tertiary: #334155; --text-main: #f8fafc; --text-secondary: #94a3b8; --border: #334155; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg-main); color: var(--text-main); }
        .hidden { display: none !important; }
        .stat-card { cursor: pointer; transition: all .3s; padding: 1.5rem; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border); }
        .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
        .tag { display: inline-block; padding: 4px 10px; background: var(--primary); color: #fff; border-radius: 12px; font-size: 11px; margin: 2px; cursor: pointer; }
        .header { background: var(--primary); color: white; padding: 1rem 2rem; }
        .main-container { display: flex; height: calc(100vh - 70px); }
        .sidebar { width: 240px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 1rem; }
        .content-area { flex: 1; padding: 2rem; overflow-y: auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .btn-primary { background: #1e293b; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; cursor: pointer; }
        /* Add more of your specific classes here if they were defined in your external stylesheet */
    </style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div><div class="loading-text">Loading...</div></div>
<div id="toast" class="toast hidden"></div>

<div id="loginPage" class="login-container">
    <div class="login-box">
        <h1>Team Hub</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br><br>
            <input type="password" id="password" placeholder="Password" required><br><br>
            <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
        </form>
    </div>
</div>

<div id="dashboardPage" class="hidden">
    <div class="header">
        <div class="header-content">
            <span id="currentUserName"></span> | <span id="currentUserRole"></span>
            <button onclick="handleLogout()">Logout</button>
        </div>
    </div>
    <div class="main-container">
        <div class="sidebar" id="sidebar"></div>
        <div class="content-area">
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="Search..." oninput="performSearch()">
                <button id="addNewBtn" onclick="openModal('add')">Add Item</button>
            </div>
            <div id="contentContainer"></div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDXO6H0y9DrsQCBhEozd3D3EZhlVbv9VWw",
    authDomain: "team-hub-666f4.firebaseapp.com",
    databaseURL: "https://team-hub-666f4-default-rtdb.firebaseio.com",
    projectId: "team-hub-666f4",
    storageBucket: "team-hub-666f4.firebasestorage.app",
    messagingSenderId: "201156915923",
    appId: "1:201156915923:web:ba3b8f4420832a414e9a26"
};

let db, currentUser, currentTab = 'home';
let data = { projects: [], tasks: [], documents: [], contacts: [], urls: [], notes: [], users: [] };

// --- Error Prevention: Safe Data Encoding ---
const safeAttr = (obj) => btoa(encodeURIComponent(JSON.stringify(obj)));
const getAttr = (str) => JSON.parse(decodeURIComponent(atob(str)));

const initApp = async () => {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    
    const saved = sessionStorage.getItem('teamhub_user');
    if (saved) {
        currentUser = JSON.parse(saved);
        showDashboard();
        setupListeners();
    }
};

const setupListeners = () => {
    const keys = ['projects', 'tasks', 'documents', 'contacts', 'urls', 'notes'];
    keys.forEach(key => {
        db.ref(key).on('value', snap => {
            data[key] = snap.val() ? Object.values(snap.val()) : [];
            renderContent();
        });
    });
};

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    
    const snap = await db.ref('users').once('value');
    const users = snap.val();
    if (users && users[u] && users[u].password === p) {
        currentUser = { name: u, role: users[u].role };
        sessionStorage.setItem('teamhub_user', JSON.stringify(currentUser));
        showDashboard();
        setupListeners();
    } else {
        alert("Invalid login");
    }
});

const showDashboard = () => {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    document.getElementById('currentUserName').textContent = currentUser.name;
    document.getElementById('currentUserRole').textContent = currentUser.role;
    initSidebar();
    switchTab('home');
};

const initSidebar = () => {
    const tabs = [
        {id:'home', label:'🏠 Home'},
        {id:'projects', label:'📁 Projects'},
        {id:'tasks', label:'✅ Tasks'},
        {id:'contacts', label:'📇 Contacts'}
    ];
    document.getElementById('sidebar').innerHTML = tabs.map(t => `
        <button onclick="switchTab('${t.id}')" class="tab-btn ${currentTab===t.id?'active':''}">
            ${t.label}
        </button>
    `).join('');
};

const switchTab = (tab) => {
    currentTab = tab;
    renderContent();
};

const renderContent = () => {
    const container = document.getElementById('contentContainer');
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    if (currentTab === 'home') {
        container.innerHTML = `<h1>Welcome ${currentUser.name}</h1><div class="grid">
            <div class="stat-card"><h3>${data.projects.length}</h3><p>Projects</p></div>
            <div class="stat-card"><h3>${data.tasks.length}</h3><p>Tasks</p></div>
        </div>`;
    } else if (currentTab === 'projects') {
        const filtered = data.projects.filter(p => p.name.toLowerCase().includes(search));
        container.innerHTML = `<div class="grid">` + filtered.map(p => `
            <div class="card">
                <h4>${p.name}</h4>
                <p>${p.description || ''}</p>
                <button onclick="viewItem('projects', '${safeAttr(p)}')">View</button>
            </div>
        `).join('') + `</div>`;
    }
};

const performSearch = () => renderContent();

const openModal = (type) => {
    document.getElementById('modalOverlay').classList.remove('hidden');
    document.getElementById('modalTitle').textContent = "Add " + currentTab;
    document.getElementById('modalBody').innerHTML = `<p>Form for ${currentTab} would go here.</p>`;
};

const closeModal = () => document.getElementById('modalOverlay').classList.add('hidden');

const handleLogout = () => {
    sessionStorage.clear();
    location.reload();
};

initApp();
</script>
</body>
</html>
