<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Improver & Translator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>✨ Message Improver & Translator</h1>
        <p class="subtitle">Improve your English & Translate to English</p>
        
        <div class="input-section">
            <label for="inputText">📝 Enter your message:</label>
            <textarea id="inputText" placeholder="Type your message here..."></textarea>
        </div>

        <div class="options">
            <label>
                <input type="radio" name="action" value="improve" checked> 
                🔧 Improve English
            </label>
            <label>
                <input type="radio" name="action" value="hindi-to-english"> 
                🇮🇳 Hindi to English
            </label>
            <label>
                <input type="radio" name="action" value="gujarati-to-english"> 
                🇬🇯 Gujarati to English
            </label>
        </div>

        <button onclick="processText()">Process Text</button>

        <div class="output-section">
            <label for="outputText">📤 Result:</label>
            <textarea id="outputText" readonly></textarea>
        </div>

        <button onclick="copyToClipboard()" class="secondary-btn">📋 Copy to Clipboard</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
